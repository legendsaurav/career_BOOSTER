<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Booster</title>
  <!-- Removed local CV template logic -->
  <script>
    (function () {
      try {
        var storage = window.localStorage;
        var theme = storage.getItem('colorTheme') || 'purple';
        var customColor = storage.getItem('customColor') || '#5b21b6';
        var roots = [document.documentElement, document.body];
        var classes = ['theme-purple', 'theme-blue', 'theme-green', 'theme-red', 'theme-orange'];

        roots.forEach(function (root) {
          if (!root) return;
          root.classList.remove.apply(root.classList, classes);
          root.classList.add('theme-' + theme);
        });

        if (theme === 'custom') {
          roots.forEach(function (root) {
            if (!root) return;
            root.style.setProperty('--primary-color', customColor);
            root.style.setProperty('--primary-2', customColor);
            root.style.setProperty('--primary-gradient', 'linear-gradient(135deg, ' + customColor + ' 0%, ' + customColor + ' 100%)');
            root.style.setProperty('--background-color', '#f8fafc');
            root.style.setProperty('--background-accent', 'none');
            root.style.setProperty('--content-background', '#ffffff');
            root.style.setProperty('--glass-bg', 'rgba(255,255,255,0.65)');
            root.style.setProperty('--text-color', '#1e293b');
            root.style.setProperty('--subtle-text-color', '#64748b');
            root.style.setProperty('--border-color', '#e2e8f0');
          });
        }
      } catch (e) {
        // Ignore storage or DOM access issues.
      }
    })();
  </script>
</head>
<body>
  <a
    href="https://cv-generator-theta-six.vercel.app/"
    style="position:fixed;right:16px;bottom:16px;z-index:2147483647;padding:10px 14px;border-radius:999px;background:#0f172a;color:#fff;text-decoration:none;font:600 14px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 8px 20px rgba(0,0,0,0.25);"
    aria-label="Open CV Generator"
    target="_blank" rel="noopener noreferrer"
  >
    Open CV Generator
  </a>
  <div id="root"></div>
  <!-- All local CV template and script logic fully removed -->
  <script type="module" src="/index.client.tsx"></script>
</body>
</html>
